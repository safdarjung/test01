<body>
    <div class="app-container">
        <h1>Homework</h1>

        <div class="filter-bar">
            <button class="filter-btn active">Today</button>
            <button class="filter-btn">This Week</button>
            <button class="filter-btn">All</button>
        </div>

        <div class="card">
            <h2 class="subject">📘 Math</h2>
            <p class="assignment-title">Complete exercises 1-5 on Chapter Algebra.</p>
            <p class="due-date">Due in 1 day</p>
            <button class="btn btn-primary">Submit</button>
        </div>

        <div class="card">
            <h2 class="subject">🔬 Science</h2>
            <p class="assignment-title">Prepare a presentation on the Solar System.</p>
            <p class="due-date">Due in 3 days</p>
            <button class="btn btn-accent">Mark as Done</button>
        </div>

        <div class="card">
            <h2 class="subject">📜 History</h2>
            <p class="assignment-title">Read Chapter 4: The World Wars.</p>
            <p class="due-date">Due in 5 days</p>
            <button class="btn btn-accent">Mark as Done</button>
        </div>
